name: Real Safari checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Selenium
        run: python -m pip install -r requirements.txt
      - name: Enable Safari automation on temporary runner
        run: sudo /usr/bin/safaridriver --enable
      - name: Check built site in real Safari
        run: python tests/check_safari.py
      - name: Save report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-safari-report
          path: |
            reports/*.json
            reports/*.png
          retention-days: 1
          if-no-files-found: warn
